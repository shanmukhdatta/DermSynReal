name: DermSynReal offline research gates
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile every shared research module and CLI
        run: python -m compileall -q src/dermsynreal scripts notebooks/Preprocessing/Real_Data/pipeline.py
      - name: Run offline unit tests (no clinical files and no GPU)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate ALL Kaggle notebook JSON and Python cell syntax without external models
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for location in ("notebooks/Training", "notebooks/Evaluation", "notebooks/Generation", "notebooks/Preprocessing"):
              for path in Path(location).rglob("*.ipynb"):
                  data = json.loads(path.read_text(encoding="utf-8"))
                  assert data["nbformat"] == 4 and data["cells"]
                  for i, cell in enumerate(data["cells"]):
                      if cell["cell_type"] == "code":
                          source = "".join(cell["source"])
                          compile(source, f"{path}:cell{i}", "exec")
                  print(path)
          PY

  latex-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile manuscript with latexmk
        uses: xu-cheng/latex-action@v3
        with:
          root_file: dermsynreal_manuscript.tex
          working_directory: paper
      - name: Archive generated research draft PDF
        uses: actions/upload-artifact@v4
        with:
          name: DermSynReal-manuscript-draft
          path: paper/dermsynreal_manuscript.pdf
          if-no-files-found: error
